name: Bug report
description: Report a problem with the application
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please check existing issues before submitting a report.

  - type: input
    id: version
    attributes:
      label: Application version
      description: Which version are you using?
      placeholder: "1.2.0"
    validations:
      required: true

  - type: dropdown
    id: windows-version
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the problem
      description: Explain what happened and what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the application
        2. Open ...
        3. Click ...
    validations:
      required: true
